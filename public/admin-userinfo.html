<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>접속정보 모니터링 - StudyShare</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="style.css?v=3"/>
  <link rel="stylesheet" href="design.css?v=3"/>
  <style>
    .userinfo-page-wrap {
      max-width: 1360px;
      margin: 0 auto;
      padding: 36px 24px 80px;
    }
    .userinfo-stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .userinfo-stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      box-shadow: var(--shadow-xs);
    }
    .userinfo-stat-num {
      font-size: 1.6rem;
      font-weight: 850;
      color: var(--primary);
      letter-spacing: -0.03em;
    }
    .userinfo-stat-lbl {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 650;
      margin-top: 2px;
    }
    .search-filter-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;
      gap: 14px;
      align-items: center;
      box-shadow: var(--shadow-xs);
    }
    .search-filter-box input {
      flex: 1;
      padding: 10px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.92rem;
      background: var(--surface-alt);
      outline: none;
      transition: var(--transition);
    }
    .search-filter-box input:focus {
      border-color: var(--primary);
      background: var(--surface);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }
    .json-modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .json-modal-overlay.show {
      opacity: 1;
      pointer-events: all;
    }
    .json-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      width: 100%;
      max-width: 720px;
      max-height: 85vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-modal);
    }
    .json-modal-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
    }
    .json-modal-hd h3 {
      font-size: 1.1rem;
      font-weight: 850;
      color: var(--text);
    }
    .json-modal-body {
      padding: 20px 24px;
      overflow-y: auto;
    }
    .json-modal-body pre {
      background: #0f172a;
      color: #f1f5f9;
      padding: 16px;
      border-radius: var(--radius);
      font-size: 0.8rem;
      line-height: 1.6;
      font-family: 'SF Mono', Consolas, Monaco, monospace;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
    }
  </style>
</head>
<body>

<header>
  <div class="logo" onclick="location.href='/'">
    <svg width="170" height="36" viewBox="0 0 170 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="userinfoLogoGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
          <stop stop-color="#4f46e5"/>
          <stop offset="1" stop-color="#818cf8"/>
        </linearGradient>
      </defs>
      <circle cx="10" cy="18" r="5" fill="url(#userinfoLogoGrad)"/>
      <circle cx="28" cy="8" r="4.5" fill="#6366f1"/>
      <circle cx="28" cy="28" r="4.5" fill="#38bdf8"/>
      <line x1="14" y1="15" x2="24" y2="10" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="14" y1="21" x2="24" y2="26" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
      <text x="38" y="25" font-family="'Pretendard', sans-serif" font-size="21" font-weight="900" fill="#0f172a" letter-spacing="-0.04em">Study<tspan fill="#4f46e5">Share</tspan></text>
    </svg>
    <span class="badge badge-admin" style="margin-left:4px;">접속 모니터링</span>
  </div>
  <nav>
    <button class="nav-btn" onclick="location.href='/'">홈</button>
    <button class="nav-btn" onclick="location.href='/admin.html'">관리자 대시보드</button>
  </nav>
  <div class="header-right">
    <button class="nav-btn" onclick="reloadUserInfo()">새로고침</button>
    <button class="logout-btn" onclick="doLogout()">로그아웃</button>
  </div>
</header>

<main class="userinfo-page-wrap">
  <div class="top">
    <div>
      <h1>사용자 접속 및 기기 정보 모니터링</h1>
      <p style="font-size:0.9rem; color:var(--text-sub); margin-top:4px;">사용자 환경, 네트워크, 디바이스 스펙 수집 내역을 실시간으로 확인합니다.</p>
    </div>
    <div class="actions">
      <button onclick="reloadUserInfo()">다시 불러오기</button>
      <button class="gray" onclick="openRawJson()">전체 JSON 보기</button>
    </div>
  </div>

  <div class="userinfo-stats-row">
    <div class="userinfo-stat-card">
      <div class="userinfo-stat-num" id="stat-total-count">-</div>
      <div class="userinfo-stat-lbl">총 수집 기록</div>
    </div>
    <div class="userinfo-stat-card">
      <div class="userinfo-stat-num" style="color:var(--accent);" id="stat-unique-users">-</div>
      <div class="userinfo-stat-lbl">고유 사용자 수</div>
    </div>
    <div class="userinfo-stat-card">
      <div class="userinfo-stat-num" style="color:var(--success);" id="stat-desktop-count">-</div>
      <div class="userinfo-stat-lbl">데스크톱 접속</div>
    </div>
    <div class="userinfo-stat-card">
      <div class="userinfo-stat-num" style="color:var(--warning);" id="stat-mobile-count">-</div>
      <div class="userinfo-stat-lbl">모바일 / 태블릿 접속</div>
    </div>
  </div>

  <div class="search-filter-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--text-dim); flex-shrink:0;">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="userinfo-search-input" placeholder="사용자 이름, 아이디, IP 주소 또는 브라우저/OS로 실시간 검색..." oninput="handleSearch()" />
  </div>

  <div id="status" class="status">
    접속정보를 불러오는 중...
  </div>

  <div id="content"></div>
</main>

<!-- JSON 상세 팝업 모달 -->
<div class="json-modal-overlay" id="jsonModal">
  <div class="json-modal">
    <div class="json-modal-hd">
      <h3 id="jsonModalTitle">기기 접속 원본 데이터</h3>
      <button class="modal-close" onclick="closeJsonModal()">&#x2715;</button>
    </div>
    <div class="json-modal-body">
      <pre id="jsonModalPre"></pre>
    </div>
  </div>
</div>

<script>
let rawList = [];
let filteredList = [];

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function fmt(value) {
  if (value === null || value === undefined || value === '') return '-';
  if (typeof value === 'object') return JSON.stringify(value, null, 2);
  return String(value);
}

function short(value, len = 70) {
  const s = fmt(value);
  if (s.length <= len) return s;
  return s.slice(0, len) + '...';
}

function setStatus(message, ok = true) {
  const el = document.getElementById('status');
  el.className = 'status ' + (ok ? 'ok' : 'err');
  el.innerHTML = message;
}

async function checkMe() {
  const res = await fetch('/api/me', {
    credentials: 'include',
    cache: 'no-store'
  });

  const me = await res.json();

  if (!me.loggedIn) {
    location.href = '/login.html';
    return null;
  }

  if (!me.user || me.user.role !== 'admin') {
    setStatus('관리자 계정이 아닙니다. admin 계정으로 로그인해야 접속정보를 볼 수 있습니다.', false);
    return null;
  }

  return me.user;
}

async function reloadUserInfo() {
  try {
    setStatus('접속정보를 불러오는 중...', true);

    const user = await checkMe();
    if (!user) return;

    const res = await fetch('/api/admin/userinfo', {
      credentials: 'include',
      cache: 'no-store'
    });

    let json;

    try {
      json = await res.json();
    } catch (e) {
      const text = await res.text().catch(() => '');
      setStatus('JSON 파싱 실패: ' + escapeHtml(text), false);
      return;
    }

    if (!res.ok) {
      setStatus('접속정보 조회 실패: HTTP ' + res.status + '<br><pre>' + escapeHtml(JSON.stringify(json, null, 2)) + '</pre>', false);
      return;
    }

    if (!Array.isArray(json)) {
      setStatus('응답이 배열이 아닙니다.<br><pre>' + escapeHtml(JSON.stringify(json, null, 2)) + '</pre>', false);
      return;
    }

    rawList = json;
    updateStats(json);

    setStatus(
      '관리자: <b>' + escapeHtml(user.name) + '</b> / 총 <b>' + json.length + '</b>개의 접속정보를 불러왔습니다.',
      true
    );

    handleSearch();

  } catch (e) {
    console.error('접속정보 조회 오류:', e);
    setStatus('접속정보 조회 오류: ' + escapeHtml(e.message), false);
  }
}

function updateStats(list) {
  document.getElementById('stat-total-count').textContent = list.length + '건';

  const userIds = new Set();
  let desktopCount = 0;
  let mobileCount = 0;

  list.forEach(item => {
    const uid = item.username || item.userId || item.userName || item.name;
    if (uid && uid !== '-') userIds.add(uid);

    const ua = item.browser?.userAgent || item.userAgent || '';
    if (ua.includes('Mobile') || ua.includes('Android') || ua.includes('iPhone') || ua.includes('iPad')) {
      mobileCount++;
    } else {
      desktopCount++;
    }
  });

  document.getElementById('stat-unique-users').textContent = userIds.size + '명';
  document.getElementById('stat-desktop-count').textContent = desktopCount + '건';
  document.getElementById('stat-mobile-count').textContent = mobileCount + '건';
}

function handleSearch() {
  const q = (document.getElementById('userinfo-search-input')?.value || '').toLowerCase().trim();
  if (!q) {
    filteredList = rawList;
  } else {
    filteredList = rawList.filter(item => {
      const name = (item.userName || item.name || '').toLowerCase();
      const uname = (item.username || item.userId || '').toLowerCase();
      const ip = (item.ip || '').toLowerCase();
      const ua = (item.browser?.userAgent || item.userAgent || '').toLowerCase();
      return name.includes(q) || uname.includes(q) || ip.includes(q) || ua.includes(q);
    });
  }
  renderTable(filteredList);
}

function renderTable(list) {
  const content = document.getElementById('content');

  if (!list.length) {
    content.innerHTML = `
      <div class="empty">
        <p>일치하는 접속정보가 없습니다.</p>
        <span style="font-size:0.85rem; color:var(--text-dim);">검색어를 변경하거나 필터를 초기화하세요.</span>
      </div>
    `;
    return;
  }

  content.innerHTML = `
    <div class="tbl-wrap">
      <div class="tbl-scroll">
        <table>
          <thead>
            <tr>
              <th>수집시각</th>
              <th>사용자</th>
              <th>아이디</th>
              <th>User ID</th>
              <th>IP</th>
              <th>OS / 브라우저</th>
              <th>기기</th>
              <th>화면 해상도</th>
              <th>언어 / 시간대</th>
              <th>네트워크 / 배터리</th>
              <th>상세 JSON</th>
            </tr>
          </thead>
          <tbody>
            ${list.map((item, idx) => {
              const ua = item.browser?.userAgent || item.userAgent || '';
              let os = '-', browser = '-';

              if      (ua.includes('Windows'))                          os = 'Windows';
              else if (ua.includes('Mac'))                              os = 'macOS';
              else if (ua.includes('Android'))                          os = 'Android';
              else if (ua.includes('iPhone') || ua.includes('iPad'))   os = 'iOS';
              else if (ua.includes('Linux'))                            os = 'Linux';

              if      (ua.includes('Chrome')  && !ua.includes('Edg'))  browser = 'Chrome';
              else if (ua.includes('Safari')  && !ua.includes('Chrome')) browser = 'Safari';
              else if (ua.includes('Firefox'))                          browser = 'Firefox';
              else if (ua.includes('Edg'))                              browser = 'Edge';
              else if (ua.includes('OPR'))                              browser = 'Opera';

              let device = 'desktop';
              let deviceLabel = '데스크톱';
              if (ua.includes('Mobile') || ua.includes('Android') || ua.includes('iPhone')) {
                device = 'mobile'; deviceLabel = '모바일';
              } else if (ua.includes('iPad') || ua.includes('Tablet')) {
                device = 'tablet'; deviceLabel = '태블릿';
              }

              const sw = item.screen?.width || item.screenWidth || item.windowWidth;
              const sh = item.screen?.height || item.screenHeight || item.windowHeight;
              const screenStr = (sw && sh) ? `${sw} x ${sh}` : '-';

              const lang = item.browser?.language || item.language || '-';
              const tz = item.time?.timezone || item.timezone || '-';

              let batteryStr = '-';
              if (item.hardware?.battery) {
                batteryStr = typeof item.hardware.battery === 'object'
                  ? `${item.hardware.battery.level ?? ''}${item.hardware.battery.charging ? ' (충전)' : ''}`
                  : String(item.hardware.battery);
              } else if (item.battery) {
                batteryStr = typeof item.battery === 'object'
                  ? `${item.battery.level ?? ''}%${item.battery.charging ? ' (충전)' : ''}`
                  : String(item.battery);
              }

              const net = item.network?.effectiveType || item.network?.type || (typeof item.network === 'string' ? item.network : '-');

              const collectedAt = item.collectedAt
                ? new Date(item.collectedAt).toLocaleString('ko-KR')
                : (item.collectedAtClient ? new Date(item.collectedAtClient).toLocaleString('ko-KR') : '-');

              return `
                <tr>
                  <td style="font-size:0.8rem; color:var(--text-sub); white-space:nowrap;">${escapeHtml(collectedAt)}</td>
                  <td style="font-weight:700;">${escapeHtml(item.userName || item.name || '-')}</td>
                  <td style="color:var(--text-sub);">${escapeHtml(item.username || item.userId || '-')}</td>
                  <td style="color:var(--text-dim); font-size:0.8rem;">${escapeHtml(item.userId || '-')}</td>
                  <td class="mono">${escapeHtml(item.ip || '-')}</td>
                  <td class="mono">
                    <div style="font-weight:600;">${escapeHtml(os)} / ${escapeHtml(browser)}</div>
                    <div style="font-size:0.72rem; color:var(--text-dim);">${escapeHtml(short(ua, 50))}</div>
                  </td>
                  <td>
                    <span class="badge ${device === 'mobile' ? 'badge-user' : device === 'tablet' ? 'badge-pending' : 'badge-approved'}">${deviceLabel}</span>
                  </td>
                  <td class="mono">${escapeHtml(screenStr)}</td>
                  <td class="mono">
                    <div>${escapeHtml(lang)}</div>
                    <div style="font-size:0.75rem; color:var(--text-dim);">${escapeHtml(tz)}</div>
                  </td>
                  <td class="mono">
                    <div>망: ${escapeHtml(net)}</div>
                    <div style="font-size:0.75rem; color:var(--text-dim);">배터리: ${escapeHtml(batteryStr)}</div>
                  </td>
                  <td>
                    <button class="tbl-btn detail" onclick="showItemJson(${idx})">보기</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function showItemJson(idx) {
  const item = filteredList[idx] || rawList[idx];
  if (!item) return;
  document.getElementById('jsonModalTitle').textContent =
    `[${item.userName || item.name || '-'}] 접속 정보 원본 JSON`;
  document.getElementById('jsonModalPre').textContent =
    JSON.stringify(item, null, 2);
  document.getElementById('jsonModal').classList.add('show');
}

function closeJsonModal() {
  document.getElementById('jsonModal').classList.remove('show');
}

document.getElementById('jsonModal').addEventListener('click', e => {
  if (e.target === document.getElementById('jsonModal')) closeJsonModal();
});

function openRawJson() {
  const w = window.open('', '_blank');
  w.document.write('<pre style="white-space:pre-wrap;word-break:break-all;font-family:Consolas,monospace;background:#0f172a;color:#f8fafc;padding:24px;">' +
    escapeHtml(JSON.stringify(rawList, null, 2)) +
    '</pre>');
}

async function doLogout() {
  await fetch('/api/logout', {
    method: 'POST',
    credentials: 'include'
  });
  location.href = '/login.html';
}

reloadUserInfo();
</script>
</body>
</html>
