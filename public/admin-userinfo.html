<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>접속정보 모니터링 - StudyShare</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="style.css?v=3"/>
  <link rel="stylesheet" href="design.css?v=3"/>
  <style>
    .userinfo-page-wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 36px 24px 80px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo" onclick="location.href='/'">
    <svg width="170" height="36" viewBox="0 0 170 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="userinfoLogoGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
          <stop stop-color="#4f46e5"/>
          <stop offset="1" stop-color="#818cf8"/>
        </linearGradient>
      </defs>
      <circle cx="10" cy="18" r="5" fill="url(#userinfoLogoGrad)"/>
      <circle cx="28" cy="8" r="4.5" fill="#6366f1"/>
      <circle cx="28" cy="28" r="4.5" fill="#38bdf8"/>
      <line x1="14" y1="15" x2="24" y2="10" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="14" y1="21" x2="24" y2="26" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round"/>
      <text x="38" y="25" font-family="'Pretendard', sans-serif" font-size="21" font-weight="900" fill="#0f172a" letter-spacing="-0.04em">Study<tspan fill="#4f46e5">Share</tspan></text>
    </svg>
    <span class="badge badge-admin" style="margin-left:4px;">접속정보</span>
  </div>
  <nav>
    <button class="nav-btn" onclick="location.href='/'">홈</button>
    <button class="nav-btn" onclick="location.href='/admin.html'">관리자</button>
  </nav>
  <div class="header-right">
    <button class="nav-btn" onclick="reloadUserInfo()">새로고침</button>
    <button class="logout-btn" onclick="doLogout()">로그아웃</button>
  </div>
</header>

<main class="userinfo-page-wrap">
  <div class="top">
    <div>
      <h1>사용자 접속 및 기기 정보</h1>
      <p style="font-size:0.9rem; color:var(--text-sub); margin-top:4px;">사용자 환경, 네트워크, 디바이스 스펙 수집 내역을 실시간으로 확인합니다.</p>
    </div>
    <div class="actions">
      <button onclick="reloadUserInfo()">다시 불러오기</button>
      <button class="gray" onclick="openRawJson()">원본 JSON 보기</button>
    </div>
  </div>

  <div id="status" class="status">
    접속정보를 불러오는 중...
  </div>

  <div id="content"></div>
</main>

<script>
let rawList = [];

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function fmt(value) {
  if (value === null || value === undefined || value === '') return '-';
  if (typeof value === 'object') return JSON.stringify(value, null, 2);
  return String(value);
}

function short(value, len = 80) {
  const s = fmt(value);
  if (s.length <= len) return s;
  return s.slice(0, len) + '...';
}

function setStatus(message, ok = true) {
  const el = document.getElementById('status');
  el.className = 'status ' + (ok ? 'ok' : 'err');
  el.innerHTML = message;
}

async function checkMe() {
  const res = await fetch('/api/me', {
    credentials: 'include',
    cache: 'no-store'
  });

  const me = await res.json();

  if (!me.loggedIn) {
    location.href = '/login.html';
    return null;
  }

  if (!me.user || me.user.role !== 'admin') {
    setStatus('관리자 계정이 아닙니다. admin 계정으로 로그인해야 접속정보를 볼 수 있습니다.', false);
    return null;
  }

  return me.user;
}

async function reloadUserInfo() {
  try {
    setStatus('접속정보를 불러오는 중...', true);

    const user = await checkMe();
    if (!user) return;

    const res = await fetch('/api/admin/userinfo', {
      credentials: 'include',
      cache: 'no-store'
    });

    let json;

    try {
      json = await res.json();
    } catch (e) {
      const text = await res.text().catch(() => '');
      setStatus('JSON 파싱 실패: ' + escapeHtml(text), false);
      return;
    }

    if (!res.ok) {
      setStatus('접속정보 조회 실패: HTTP ' + res.status + '<br><pre>' + escapeHtml(JSON.stringify(json, null, 2)) + '</pre>', false);
      return;
    }

    if (!Array.isArray(json)) {
      setStatus('응답이 배열이 아닙니다.<br><pre>' + escapeHtml(JSON.stringify(json, null, 2)) + '</pre>', false);
      return;
    }

    rawList = json;

    setStatus(
      '관리자: <b>' + escapeHtml(user.name) + '</b> / 총 <b>' + json.length + '</b>개의 접속정보를 불러왔습니다.',
      true
    );

    renderTable(json);

  } catch (e) {
    console.error('접속정보 조회 오류:', e);
    setStatus('접속정보 조회 오류: ' + escapeHtml(e.message), false);
  }
}

function renderTable(list) {
  const content = document.getElementById('content');

  if (!list.length) {
    content.innerHTML = `
      <div class="empty">
        <p>저장된 접속정보가 없습니다.</p>
        <span style="font-size:0.85rem; color:var(--text-dim);">일반 페이지에 접속해서 /api/collect가 성공해야 여기에 표시됩니다.</span>
      </div>
    `;
    return;
  }

  content.innerHTML = `
    <div class="tbl-wrap">
      <div class="tbl-scroll">
        <table>
          <thead>
            <tr>
              <th>수집시각</th>
              <th>사용자</th>
              <th>아이디</th>
              <th>User ID</th>
              <th>IP</th>
              <th>권한요청</th>
              <th>브라우저</th>
              <th>화면</th>
              <th>위치</th>
              <th>카메라/마이크</th>
              <th>원본</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(item => {
              const browser = item.browser || {};
              const screen = item.screen || {};
              const requested = item.requested || {};
              const geo = requested.geolocation || {};
              const media = requested.mediaDevices || requested.media || {};

              return `
                <tr>
                  <td style="font-size:0.8rem; color:var(--text-sub); white-space:nowrap;">${escapeHtml(item.collectedAt || item.collectedAtClient || '-')}</td>
                  <td style="font-weight:700;">${escapeHtml(item.userName || '-')}</td>
                  <td style="color:var(--text-sub);">${escapeHtml(item.username || '-')}</td>
                  <td style="color:var(--text-dim); font-size:0.8rem;">${escapeHtml(item.userId || '-')}</td>
                  <td class="mono">${escapeHtml(item.ip || '-')}</td>
                  <td><span class="badge badge-user">${escapeHtml(String(item.requestedPermissions ?? '-'))}</span></td>
                  <td class="mono">
                    <div>${escapeHtml(browser.language || '-')}</div>
                    <div style="font-size:0.75rem; color:var(--text-dim);">${escapeHtml(short(browser.userAgent || '-', 90))}</div>
                  </td>
                  <td class="mono">
                    ${escapeHtml(screen.width || '-') } x ${escapeHtml(screen.height || '-')}
                    ${screen.pixelRatio ? `<br>DPR: ${escapeHtml(screen.pixelRatio)}` : ''}
                  </td>
                  <td class="mono">
                    allowed: ${escapeHtml(String(geo.allowed ?? '-'))}
                    ${geo.coords?.latitude ? `<br>${escapeHtml(geo.coords.latitude)}, ${escapeHtml(geo.coords.longitude)}` : ''}
                  </td>
                  <td class="mono">
                    cam: ${escapeHtml(String(media.cameraOpened ?? media.streamOpened ?? '-'))}
                    mic: ${escapeHtml(String(media.microphoneOpened ?? '-'))}
                  </td>
                  <td>
                    <details>
                      <summary>JSON</summary>
                      <pre>${escapeHtml(JSON.stringify(item, null, 2))}</pre>
                    </details>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function openRawJson() {
  const w = window.open('', '_blank');
  w.document.write('<pre style="white-space:pre-wrap;word-break:break-all;font-family:Consolas,monospace;background:#0f172a;color:#f8fafc;padding:24px;">' +
    escapeHtml(JSON.stringify(rawList, null, 2)) +
    '</pre>');
}

async function doLogout() {
  await fetch('/api/logout', {
    method: 'POST',
    credentials: 'include'
  });

  location.href = '/login.html';
}

reloadUserInfo();
</script>
</body>
</html>
